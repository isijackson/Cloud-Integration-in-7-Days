# Replace the IPs with your client VM public IPs. Keep ansible_user matching the
# login user you created on each VM (ubuntu on Azure/GCP Ubuntu images).
[azure]
192.0.2.30 ansible_user=ubuntu

[gcp]
198.51.100.30 ansible_user=ubuntu

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
